<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - FloraCraft Botanical Store</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-surface-alt d-flex flex-column min-vh-100">

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 border-0 bg-surface shadow-lg rounded-4 position-relative">
          <!-- Auth Controls: LTR/RTL & Dark/Light Mode Toggles -->
          <div class="auth-card-actions">
            <button type="button" class="icon-btn rtl-toggle-btn" title="Toggle Layout Direction" aria-label="Toggle Layout Direction">
              <i class="fa-solid fa-globe"></i>
            </button>
            <button type="button" class="icon-btn theme-toggle-btn" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
              <i class="fa-solid fa-moon"></i>
            </button>
          </div>

          <div class="text-center mb-4 pt-2 pt-md-0">
            <a href="index.html" class="brand-logo justify-content-center mb-3">
              <span class="brand-icon"><i class="fa-solid fa-seedling"></i></span>
              <span>Flora<span style="color:var(--accent);">Craft</span></span>
            </a>
            <h2 class="fw-bold">Welcome Back</h2>
            <p class="text-muted small">Sign in to manage your botanical orders & plant care subscriptions.</p>
          </div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address</label>
              <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-label small fw-bold mb-0">Password</label>
                <a href="forgot-password.html" class="small text-primary">Forgot password?</a>
              </div>
              <input type="password" id="loginPassword" class="form-control mt-1" placeholder="••••••••" required>
            </div>
            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe" checked>
              <label class="form-check-label small text-muted" for="rememberMe">Remember my botanical session</label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
            </button>
            <div class="position-relative my-4 text-center">
              <hr class="text-muted border-secondary">
              <span class="position-absolute top-50 start-50 translate-middle px-3 text-muted small" style="background: var(--bg-surface);">OR</span>
            </div>
            <div class="d-flex flex-column gap-2 mb-2">
              <button type="button" class="btn btn-social w-100 d-flex align-items-center justify-content-center" onclick="socialLogin('google')">
                <i class="fa-brands fa-google text-danger me-2"></i> Sign in with Google
              </button>
              <button type="button" class="btn btn-social w-100 d-flex align-items-center justify-content-center" onclick="socialLogin('apple')">
                <i class="fa-brands fa-apple fs-5 me-2" style="margin-bottom:2px;"></i> Sign in with Apple
              </button>
            </div>
          </form>

          <div class="text-center text-muted small mt-3">
            Don't have an account? <a href="register.html" class="text-primary fw-bold">Create Free Account</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 bg-surface border-top text-center text-muted small mt-auto">
    © 2026 FloraCraft Botanical Co. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/compare.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.getElementById('loginForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      const res = window.loginUser(email, pass);

      if (res.success) {
        window.showToast("Login successful!", "", "success");
      } else {
        window.showToast("Login Failed", res.message, "danger");
      }
    });
  
    function socialLogin(provider) {
      const email = `${provider}@floracraft.com`;
      const pass = 'social123';
      const name = provider.charAt(0).toUpperCase() + provider.slice(1) + ' User';
      
      let res = window.loginUser(email, pass);
      if (!res.success) {
        res = window.registerUser(name, email, pass);
      }
      
      if (res.success) {
        window.showToast("Login successful!", "", 'success');
      }
    }
  </script>
</body>
</html>
