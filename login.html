<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In - FloraCraft Botanical Store</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-surface-alt d-flex flex-column min-vh-100">

  <header class="py-3 border-bottom" style="background: var(--primary-dark);">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="/" class="brand-logo">
        <span class="brand-icon"><i class="fa-solid fa-seedling"></i></span>
        <span>Flora<span style="color:var(--accent);">Craft</span></span>
      </a>
            <div class="d-flex align-items-center gap-3">
        <div class="d-flex align-items-center gap-2">
          <button class="icon-btn rtl-toggle-btn" title="Toggle Layout Direction">
            <i class="fa-solid fa-globe"></i>
          </button>
          <button class="icon-btn theme-toggle-btn" title="Toggle Dark Mode">
            <i class="fa-solid fa-moon"></i>
          </button>
        </div>
        <a href="index.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back to Home</a>
      </div>
    </div>
  </header>

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 border-0 bg-surface shadow-lg rounded-4">
          <div class="text-center mb-4">
            <span class="brand-icon mx-auto mb-3" style="width:48px; height:48px;"><i class="fa-solid fa-seedling"></i></span>
            <h2 class="fw-bold">Welcome Back</h2>
            <p class="text-muted small">Sign in to manage your botanical orders & plant care subscriptions.</p>
          </div>

          <!-- Demo Account Helper Box -->
                      <div class="alert alert-info py-2 px-3 small rounded-3 mb-4">
              <div class="d-flex justify-content-between align-items-center">
                <div>
                  <strong><i class="fa-solid fa-seedling text-success me-1"></i> Demo Account:</strong><br>
                  <code>gardener@floracraft.com</code> / <code>password123</code>
                </div>
                <button class="btn btn-sm btn-outline-primary" onclick="autofillDemo()">Autofill User</button>
              </div>
            </div>

          <form id="loginForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address</label>
              <input type="email" id="loginEmail" class="form-control" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <div class="d-flex justify-content-between align-items-center">
                <label class="form-label small fw-bold mb-0">Password</label>
                <a href="forgot-password.html" class="small text-primary">Forgot password?</a>
              </div>
              <input type="password" id="loginPassword" class="form-control mt-1" placeholder="••••••••" required>
            </div>
            <div class="mb-4 form-check">
              <input type="checkbox" class="form-check-input" id="rememberMe" checked>
              <label class="form-check-label small text-muted" for="rememberMe">Remember my botanical session</label>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mb-3">
              <i class="fa-solid fa-right-to-bracket me-1"></i> Sign In
            </button>
            <div class="position-relative my-4 text-center">
              <hr class="text-muted border-secondary">
              <span class="position-absolute top-50 start-50 translate-middle px-3 text-muted small" style="background: var(--bg-surface);">OR</span>
            </div>
            <div class="d-flex flex-column gap-2 mb-2">
              <button type="button" class="btn btn-outline-secondary w-100 text-main d-flex align-items-center justify-content-center" style="background-color: var(--bg-surface); border-color: var(--border-color);" onclick="socialLogin('google')">
                <i class="fa-brands fa-google text-danger me-2"></i> Sign in with Google
              </button>
              <button type="button" class="btn btn-outline-secondary w-100 text-main d-flex align-items-center justify-content-center" style="background-color: var(--bg-surface); border-color: var(--border-color);" onclick="socialLogin('apple')">
                <i class="fa-brands fa-apple fs-5 me-2" style="margin-bottom:2px;"></i> Sign in with Apple
              </button>
            </div>
          </form>

          <div class="text-center text-muted small mt-3">
            Don't have an account? <a href="register.html" class="text-primary fw-bold">Create Free Account</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 bg-surface border-top text-center text-muted small mt-auto">
    © 2026 FloraCraft Botanical Co. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/compare.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    

    function autofillDemo() {
      document.getElementById('loginEmail').value = 'gardener@floracraft.com';
      document.getElementById('loginPassword').value = 'password123';
    }

    document.getElementById('loginForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value;
      const pass = document.getElementById('loginPassword').value;
      const res = window.loginUser(email, pass);

            if (res.success) {
        window.showToast("Welcome Back!", `Welcome back, ${res.user.name}!`, "success");
        setTimeout(() => window.location.href = "index.html", 500);
      } else {
        window.showToast("Login Failed", res.message, "danger");
      }
    });
  
    function socialLogin(provider) {
      const email = `${provider}@floracraft.com`;
      const pass = 'social123';
      const name = provider.charAt(0).toUpperCase() + provider.slice(1) + ' User';
      
      let res = window.loginUser(email, pass);
      if (!res.success) {
        res = window.registerUser(name, email, pass);
      }
      
      if (res.success) {
        window.showToast(`${name} Authenticated`, `Successfully signed in via ${provider.charAt(0).toUpperCase() + provider.slice(1)}!`, 'success');
        setTimeout(() => window.location.href = "index.html", 500);
      }
    }
</script>
</body>
</html>
