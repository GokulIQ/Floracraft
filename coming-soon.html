<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coming Soon - FloraCraft Rare Specimen Drop</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="d-flex flex-column min-vh-100" style="background: linear-gradient(rgba(11,19,14,0.85), rgba(11,19,14,0.9)), url('https://images.unsplash.com/photo-1545241047-6083a3684587?auto=format&fit=crop&w=1600&q=80') center/cover no-repeat;">

  <header class="py-4 text-center">
    <div class="container">
      <a href="index.html" class="brand-logo justify-content-center text-white">
        <span class="brand-icon"><i class="fa-solid fa-seedling"></i></span>
        <span>FloraCraft</span>
      </a>
    </div>
  </header>

  <div class="container my-auto py-5 text-center text-white">
    <div class="max-w-700 mx-auto">
      <span class="badge bg-success px-3 py-2 rounded-pill mb-3 text-uppercase fw-bold"><i class="fa-solid fa-clock me-1"></i> Rare Seedling Launch</span>
      <h1 class="display-4 font-heading fw-bold mb-3">Something Botanical is Germinating</h1>
      <p class="lead text-white-50 mb-5">We are preparing our limited-edition autumn rare variegated tropical drop and handcrafted ceramic glaze collection.</p>

      <!-- Countdown -->
      <div class="deal-countdown justify-content-center mb-5">
        <div class="countdown-box bg-white bg-opacity-10 border-white border-opacity-25">
          <span class="countdown-number" id="csDays">18</span>
          <span class="countdown-label text-white-50">Days</span>
        </div>
        <div class="countdown-box bg-white bg-opacity-10 border-white border-opacity-25">
          <span class="countdown-number" id="csHours">06</span>
          <span class="countdown-label text-white-50">Hours</span>
        </div>
        <div class="countdown-box bg-white bg-opacity-10 border-white border-opacity-25">
          <span class="countdown-number" id="csMins">32</span>
          <span class="countdown-label text-white-50">Mins</span>
        </div>
        <div class="countdown-box bg-white bg-opacity-10 border-white border-opacity-25">
          <span class="countdown-number" id="csSecs">14</span>
          <span class="countdown-label text-white-50">Secs</span>
        </div>
      </div>

      <!-- Notify Me -->
      <form class="newsletter-form d-flex flex-column flex-sm-row gap-2 max-w-500 mx-auto" id="csNotifyForm">
        <input type="email" class="form-control form-control-lg rounded-pill px-4" placeholder="Enter email to get VIP early access..." required>
        <button type="submit" class="btn btn-primary btn-lg rounded-pill px-4">
          <i class="fa-solid fa-bell me-1"></i> Notify Me
        </button>
      </form>
    </div>
  </div>

  <footer class="py-4 text-center text-white-50 small mt-auto">
    <div class="container">
      <div class="social-links justify-content-center mb-3">
        <a href="#" class="social-link-btn"><i class="fa-brands fa-instagram"></i></a>
        <a href="#" class="social-link-btn"><i class="fa-brands fa-pinterest"></i></a>
        <a href="#" class="social-link-btn"><i class="fa-brands fa-facebook-f"></i></a>
      </div>
      <div>© 2026 FloraCraft Botanical Co. All rights reserved. • <a href="index.html" class="text-white text-decoration-underline">Visit Current Store</a></div>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    (function() {
      let seconds = 18 * 86400 + 6 * 3600 + 32 * 60 + 14;
      setInterval(() => {
        if (seconds > 0) seconds--;
        const d = Math.floor(seconds / 86400);
        const h = Math.floor((seconds % 86400) / 3600);
        const m = Math.floor((seconds % 3600) / 60);
        const s = seconds % 60;
        document.getElementById('csDays').textContent = String(d).padStart(2, '0');
        document.getElementById('csHours').textContent = String(h).padStart(2, '0');
        document.getElementById('csMins').textContent = String(m).padStart(2, '0');
        document.getElementById('csSecs').textContent = String(s).padStart(2, '0');
      }, 1000);

      document.getElementById('csNotifyForm')?.addEventListener('submit', (e) => {
        e.preventDefault();
        window.showToast("VIP Reservation Saved!", "You have been placed on our priority notification list for the autumn drop.", "success");
        e.target.reset();
      });
    })();
  </script>
</body>
</html>
