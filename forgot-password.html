<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password - FloraCraft Botanical Store</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-surface-alt d-flex flex-column min-vh-100">

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-6 col-lg-5">
        <div class="card p-4 p-md-5 border-0 bg-surface shadow-lg rounded-4 position-relative">
          <!-- Auth Controls: LTR/RTL & Dark/Light Mode Toggles -->
          <div class="auth-card-actions">
            <button type="button" class="icon-btn rtl-toggle-btn" title="Toggle Layout Direction" aria-label="Toggle Layout Direction">
              <i class="fa-solid fa-globe"></i>
            </button>
            <button type="button" class="icon-btn theme-toggle-btn" title="Toggle Dark Mode" aria-label="Toggle Dark Mode">
              <i class="fa-solid fa-moon"></i>
            </button>
          </div>

          <div class="text-center mb-4 pt-2 pt-md-0">
            <a href="index.html" class="brand-logo justify-content-center mb-3">
              <span class="brand-icon"><i class="fa-solid fa-seedling"></i></span>
              <span>Flora<span style="color:var(--accent);">Craft</span></span>
            </a>
            <h2 class="fw-bold">Password Recovery</h2>
            <p class="text-muted small">Enter your account email address to receive a secure recovery code.</p>
          </div>

          <form id="forgotForm">
            <div class="mb-3">
              <label class="form-label small fw-bold">Email Address</label>
              <input type="email" id="forgotEmail" class="form-control" placeholder="name@example.com" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100">Send Recovery Instructions</button>
          </form>

          <div class="text-center text-muted small mt-4">
            Remembered your password? <a href="login.html" class="text-primary fw-bold">Return to Login</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 bg-surface border-top text-center text-muted small mt-auto">
    © 2026 FloraCraft Botanical Co. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.getElementById('forgotForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const email = document.getElementById('forgotEmail').value;
      window.showToast("Recovery Dispatched", `Password reset link sent to ${email}. Check your inbox!`, "success");
      setTimeout(() => window.location.href = "login.html", 2000);
    });
  </script>
</body>
</html>
