<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Plant Not Found | FloraCraft</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-surface-alt d-flex flex-column min-vh-100">

  <header class="py-3 border-bottom" style="background: var(--primary-dark);">
    <div class="container d-flex justify-content-between align-items-center">
      <a href="/" class="brand-logo">
        <span class="brand-icon"><i class="fa-solid fa-seedling"></i></span>
        <span>Flora<span style="color:var(--accent);">Craft</span></span>
      </a>
      <a href="index.html" class="btn btn-outline-light btn-sm"><i class="fa-solid fa-house me-1"></i> Home</a>
    </div>
  </header>

  <div class="container my-auto py-5 text-center">
    <div class="max-w-600 mx-auto">
      <div class="mb-4 text-primary" style="font-size: 6rem; line-height: 1;">
        <i class="fa-solid fa-seedling"></i>
      </div>
      <h1 class="display-3 font-heading fw-bold mb-2">404</h1>
      <h2 class="h3 fw-bold mb-3">Oops! This Botanical Specimen Has Wilted.</h2>
      <p class="text-muted lead mb-4">The page you are looking for might have been repotted, pruned, or never existed in our nursery.</p>
      
      <form class="input-group max-w-400 mx-auto mb-4" action="products.html" method="GET">
        <input type="text" name="search" class="form-control rounded-start-pill ps-3" placeholder="Search plants, terracotta pots...">
        <button class="btn btn-primary rounded-end-pill px-4" type="submit"><i class="fa-solid fa-magnifying-glass"></i></button>
      </form>

      <div class="d-flex flex-wrap gap-2 justify-content-center">
        <a href="index.html" class="btn btn-primary"><i class="fa-solid fa-house me-1"></i> Return to Homepage</a>
        <a href="products.html" class="btn btn-outline-secondary"><i class="fa-solid fa-shop me-1"></i> Browse Catalog</a>
      </div>
    </div>
  </div>

  <footer class="py-3 bg-surface border-top text-center text-muted small mt-auto">
    © 2026 FloraCraft Botanical Co. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
