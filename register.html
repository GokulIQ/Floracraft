<!DOCTYPE html>
<html lang="en" data-theme="light" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account - FloraCraft Botanical Store</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌿</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/responsive.css">
  <link rel="stylesheet" href="assets/css/rtl.css">
</head>
<body class="bg-surface-alt d-flex flex-column min-vh-100">

  <div class="container my-auto py-5">
    <div class="row justify-content-center">
      <div class="col-md-7 col-lg-6">
        <div class="card p-4 p-md-5 border-0 bg-surface shadow-lg rounded-4">
          <div class="text-center mb-4">
            <a href="index.html" class="brand-logo auth-brand-logo justify-content-center mb-3">
              <span class="brand-icon"><i class="fa-solid fa-seedling"></i></span>
              <span>Flora<span style="color:var(--accent);">Craft</span></span>
            </a>
            <h2 class="fw-bold">Create Botanical Account</h2>
            <p class="text-muted small">Unlock 15% discount, order tracking, and plant health care reminders.</p>
          </div>

          <form id="registerForm">
            <div class="row g-3">
              <div class="col-md-6">
                <label class="form-label small fw-bold">Full Name</label>
                <input type="text" id="regName" class="form-control" placeholder="Maya Lin" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Email Address</label>
                <input type="email" id="regEmail" class="form-control" placeholder="maya@example.com" required>
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Phone (Optional)</label>
                <input type="tel" id="regPhone" class="form-control" placeholder="+1 (555) 000-0000">
              </div>
              <div class="col-md-6">
                <label class="form-label small fw-bold">Default City (Optional)</label>
                <input type="text" id="regAddress" class="form-control" placeholder="Portland, OR">
              </div>
              <div class="col-12">
                <label class="form-label small fw-bold">Choose Password</label>
                <input type="password" id="regPassword" class="form-control" placeholder="Minimum 6 characters" minlength="6" required>
              </div>
              <div class="col-12">
                <button type="submit" class="btn btn-primary btn-lg w-100 mt-2">
                  <i class="fa-solid fa-user-plus me-1"></i> Create Botanical Account
                </button>
                <div class="position-relative my-4 text-center">
                  <hr class="text-muted border-secondary">
                  <span class="position-absolute top-50 start-50 translate-middle px-3 text-muted small" style="background: var(--bg-surface);">OR</span>
                </div>
                <div class="d-flex flex-column gap-2 mb-2">
                  <button type="button" class="btn btn-outline-secondary w-100 text-main d-flex align-items-center justify-content-center" style="background-color: var(--bg-surface); border-color: var(--border-color);" onclick="socialLogin('google')">
                    <i class="fa-brands fa-google text-danger me-2"></i> Sign up with Google
                  </button>
                  <button type="button" class="btn btn-outline-secondary w-100 text-main d-flex align-items-center justify-content-center" style="background-color: var(--bg-surface); border-color: var(--border-color);" onclick="socialLogin('apple')">
                    <i class="fa-brands fa-apple fs-5 me-2" style="margin-bottom:2px;"></i> Sign up with Apple
                  </button>
                </div>
              </div>
            </div>
          </form>

          <div class="text-center text-muted small mt-4">
            Already have an account? <a href="login.html" class="text-primary fw-bold">Sign In</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <footer class="py-3 bg-surface border-top text-center text-muted small mt-auto">
    © 2026 FloraCraft Botanical Co. All rights reserved.
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/theme.js"></script>
  <script src="assets/js/rtl.js"></script>
  <script src="assets/js/auth.js"></script>
  <script src="assets/js/cart.js"></script>
  <script src="assets/js/wishlist.js"></script>
  <script src="assets/js/compare.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
    document.getElementById('registerForm')?.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPassword').value;
      const phone = document.getElementById('regPhone').value;
      const addr = document.getElementById('regAddress').value;

      const res = window.registerUser(name, email, pass, phone, addr);
      if (res.success) {
        window.showToast("Account Created!", `Welcome to FloraCraft, ${res.user.name}!`, "success");
        setTimeout(() => window.location.href = "index.html", 600);
      } else {
        window.showToast("Registration Failed", res.message, "danger");
      }
    });
  
    function socialLogin(provider) {
      const email = `${provider}@floracraft.com`;
      const pass = 'social123';
      const name = provider.charAt(0).toUpperCase() + provider.slice(1) + ' User';
      
      let res = window.loginUser(email, pass);
      if (!res.success) {
        res = window.registerUser(name, email, pass);
      }
      
      if (res.success) {
        window.showToast(`${name} Authenticated`, `Successfully signed in via ${provider.charAt(0).toUpperCase() + provider.slice(1)}!`, 'success');
        setTimeout(() => window.location.href = "index.html", 500);
      }
    }
</script>
</body>
</html>
